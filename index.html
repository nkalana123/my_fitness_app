<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fitness">
<title>Fitness Tracker</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f2f4f8;--card:#ffffff;--text:#12151c;--muted:#5b6472;--border:#e1e5ed;--soft:#eceff4;--green:#10b981;--green-dark:#047857;--green-light:#d1fae5;--card-shadow:0 2px 10px rgba(23,35,64,.06)}
html.dark{--bg:#0d1117;--card:#161b22;--text:#f0f3f8;--muted:#8b95a5;--border:#262c36;--soft:#1c2230;--green-light:rgba(16,185,129,.2);--card-shadow:0 2px 12px rgba(0,0,0,.35)}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Helvetica,Arial,sans-serif}
button,input{font:inherit}button{border:0;cursor:pointer;color:inherit}.hidden{display:none!important}
.app{width:100%;max-width:650px;min-height:100vh;margin:auto;padding-bottom:100px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:max(24px,env(safe-area-inset-top) + 10px) 20px 12px}
.date-label{color:var(--muted);font-size:12px;font-weight:700}.topbar h1{margin:4px 0 0;font-size:30px;line-height:1;letter-spacing:-.04em}
.icon-btn,.back-btn{width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.08);font-size:18px}
main{padding:0 20px}.screen{animation:fadeIn .18s ease-out}@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.today-heading{padding-top:22px;margin-bottom:20px}.eyebrow{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.11em}h2{margin:5px 0 0;font-size:32px;line-height:1.08;letter-spacing:-.04em}
.today-card{position:relative;width:100%;overflow:hidden;padding:24px;border-radius:27px;color:#fff;text-align:left;box-shadow:0 12px 30px rgba(0,0,0,.13)}
.today-card.upper{background:linear-gradient(135deg,#4f7cff,#7c3aed);box-shadow:0 14px 32px rgba(79,110,255,.35)}.today-card.lower{background:linear-gradient(135deg,#22c55e,#059669);box-shadow:0 14px 32px rgba(34,197,94,.35)}.today-card.rest{background:linear-gradient(135deg,#8b5cf6,#6d28d9);box-shadow:0 14px 32px rgba(139,92,246,.35)}
.today-icon{font-size:36px}.today-card h3{margin:10px 0 4px;font-size:24px}.today-card p{margin:0;color:rgba(255,255,255,.78);font-size:13px}
.ribbon{position:absolute;top:14px;right:-32px;transform:rotate(35deg);padding:6px 38px;background:#fff;color:#111827;font-size:10px;font-weight:900;letter-spacing:.08em}
.today-footer{display:flex;align-items:center;justify-content:space-between;margin-top:22px}.today-meta{font-size:11px;color:rgba(255,255,255,.78)}.start-pill{padding:9px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:11px;font-weight:800}
.section-heading{margin-top:30px;margin-bottom:12px}.section-heading h3{margin:0;font-size:19px}.section-heading p{margin:4px 0 0;color:var(--muted);font-size:13px}
.workout-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.workout-small{padding:18px;border-radius:22px;background:var(--card);border:1px solid var(--border);box-shadow:var(--card-shadow);text-align:left}.workout-icon{font-size:28px}.workout-small h3{margin:10px 0 4px;font-size:16px}.workout-small p{margin:0;color:var(--muted);font-size:11px}
.week-progress-card{margin-top:16px;padding:17px;border-radius:20px;background:var(--card);border:1px solid var(--border);box-shadow:var(--card-shadow)}.week-progress-card .progress-header strong{font-size:14px}
.calendar-block{margin-top:18px;padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--border);box-shadow:var(--card-shadow)}.calendar-block+.calendar-block{margin-top:14px}
.calendar-month-label{font-size:13px;font-weight:850;letter-spacing:.02em}
.calendar-weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-top:12px;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.04em;text-align:center}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px;margin-top:6px}
.calendar-day{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:5px 0;font-size:11px;font-weight:650;color:var(--text);border-radius:10px}
.calendar-day.empty{visibility:hidden}
.calendar-day.today .day-num{display:flex;width:20px;height:20px;align-items:center;justify-content:center;border-radius:50%;background:var(--green);color:#fff;font-weight:900}
.calendar-day .day-num{display:flex;width:20px;height:20px;align-items:center;justify-content:center}
.calendar-day .dot{width:5px;height:5px;border-radius:50%;background:var(--green)}
.calendar-day .dot.empty-dot{background:transparent}
.workout-header{display:flex;align-items:center;gap:12px;padding-top:20px}.workout-header h2{margin-top:3px}.workout-header-icon{width:46px;height:46px;flex-shrink:0;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:23px;background:linear-gradient(135deg,var(--accent-a,var(--muted)),var(--accent-b,var(--muted)))}.workout-header .eyebrow{color:var(--accent-a,var(--muted))}.progress-card{margin-top:20px;padding:17px;border-radius:20px;background:var(--card);border:1px solid var(--border);box-shadow:var(--card-shadow)}.progress-header{display:flex;justify-content:space-between;font-size:13px}.progress-header span{color:var(--muted)}.progress-track{height:7px;margin-top:12px;overflow:hidden;border-radius:10px;background:var(--soft)}.progress-bar{width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent-a,var(--green)),var(--accent-b,var(--green-dark)));transition:width .25s}
.exercise-list{display:flex;flex-direction:column;gap:16px;margin-top:16px}.exercise-card{padding:18px;border-radius:24px;background:var(--card);border:1px solid var(--border);box-shadow:var(--card-shadow)}
.exercise-title-row{display:flex;align-items:center;gap:12px}.exercise-number{display:flex;width:38px;height:38px;flex-shrink:0;align-items:center;justify-content:center;border-radius:12px;background:linear-gradient(135deg,var(--accent-a,var(--soft)),var(--accent-b,var(--soft)));color:#fff;font-size:13px;font-weight:900}.exercise-title{font-size:17px;font-weight:850}
.exercise-body{display:flex;gap:12px;align-items:stretch;margin-top:15px}
.exercise-inputs{flex:1;min-width:0}.exercise-inputs>:first-child{margin-top:0}
.video-thumb{position:relative;flex:0 0 100px;width:100px;min-height:110px;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,var(--accent-a,#111827),var(--accent-b,#020617));display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
.video-thumb .play{display:flex;width:38px;height:38px;align-items:center;justify-content:center;border-radius:50%;background:#ef4444;font-size:16px}
.video-frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:17px;background:#000}.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-modal{position:fixed;inset:0;z-index:200;background:rgba(5,7,15,.94);display:flex;align-items:center;justify-content:center;padding:24px}
.video-modal .video-frame{width:100%;max-width:650px}
.video-modal-close{position:absolute;top:max(20px,env(safe-area-inset-top) + 10px);right:20px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
.target-box{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:13px;border-radius:15px;background:var(--soft)}.target-label{color:var(--muted);font-size:12px}.target-value{font-size:14px;font-weight:850}
.input-label{display:block;margin-top:15px;color:var(--muted);font-size:10px;font-weight:850;letter-spacing:.08em}
.set-row{display:grid;grid-template-columns:38px 1fr 1fr;gap:6px;align-items:center;margin-top:8px}.set-number{display:flex;height:46px;align-items:center;justify-content:center;border-radius:13px;background:var(--soft);color:var(--muted);font-size:11px;font-weight:900}
.set-row input{width:100%;padding:12px 5px;border:1px solid var(--border);border-radius:13px;outline:none;background:var(--soft);color:var(--text);text-align:center;font-size:17px;font-weight:800}.set-row input:focus{border-color:var(--green)}
.set-actions{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px}.set-action{width:42px;height:42px;border-radius:50%;background:var(--soft);border:1px solid var(--border);font-size:25px;line-height:1;font-weight:500}.set-count{min-width:72px;text-align:center;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.05em}
.exercise-actions{display:flex;gap:8px;margin-top:12px}.exercise-complete,.history-btn{flex:1;padding:11px;border-radius:13px;background:var(--soft);color:var(--muted);font-size:12px;font-weight:850}.exercise-complete.done{background:var(--green-light);color:var(--green-dark)}
.exercise-history{margin-top:12px;padding:14px;border-radius:16px;background:var(--soft);border:1px solid var(--border)}.exercise-history h4{margin:0 0 10px;font-size:13px}.history-entry{padding:10px 0;border-top:1px solid var(--border)}.history-entry:first-of-type{border-top:0}.history-date{font-weight:850;font-size:13px}.history-line{margin-top:3px;color:var(--muted);font-size:12px;line-height:1.45}
.complete-btn{width:100%;margin-top:18px;padding:17px;border-radius:18px;background:linear-gradient(135deg,var(--accent-a,var(--green)),var(--accent-b,var(--green-dark)));color:#fff;font-size:15px;font-weight:850;box-shadow:0 8px 20px var(--accent-shadow,rgba(16,185,129,.28))}.save-exit-btn{display:block;width:100%;padding:14px;background:transparent;color:var(--muted);font-size:13px;font-weight:700}
.history-header{display:flex;align-items:center;justify-content:space-between;padding-top:20px}.summary-card{margin-top:22px;padding:20px;border-radius:24px;background:#0f172a;color:#fff}.summary-label{color:#94a3b8;font-size:12px}.summary-row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:5px}.big-number{font-size:42px;font-weight:900}.summary-unit{margin-left:4px;color:#94a3b8;font-size:12px}.streak{text-align:right}.streak strong{display:block;color:#34d399;font-size:22px}.streak span{color:#94a3b8;font-size:10px}.week-row{display:flex;align-items:center;gap:9px;margin-bottom:10px}.week-label{width:48px;flex-shrink:0;color:var(--muted);font-size:10px}.week-bar-container{flex:1;height:25px;overflow:hidden;border-radius:8px;background:var(--soft)}.week-bar{display:flex;height:100%;align-items:center;padding-left:7px;border-radius:8px;background:var(--green);color:#fff;font-size:9px;font-weight:850}.week-dates{width:82px;flex-shrink:0;color:var(--muted);text-align:right;font-size:8px}
.history-card{width:100%;margin-bottom:9px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--border);box-shadow:var(--card-shadow);color:var(--text);text-align:left}.history-row{display:flex;align-items:center;gap:12px}.history-icon{display:flex;width:43px;height:43px;flex-shrink:0;align-items:center;justify-content:center;border-radius:13px;background:var(--soft);font-size:21px}.history-info{flex:1}.history-info strong{display:block;font-size:14px}.history-info span{display:block;margin-top:3px;color:var(--muted);font-size:11px}.history-arrow{color:var(--muted);font-size:22px}
.bottom-nav{position:fixed;z-index:50;right:0;bottom:0;left:0;display:flex;justify-content:center;padding:10px 0 max(12px,env(safe-area-inset-bottom));background:rgba(255,255,255,.92);border-top:1px solid var(--border);backdrop-filter:blur(15px)}html.dark .bottom-nav{background:rgba(15,23,42,.92)}.bottom-nav button{display:flex;width:120px;flex-direction:column;align-items:center;gap:3px;background:transparent;color:var(--muted)}.bottom-nav button span{font-size:19px}.bottom-nav button small{font-size:10px;font-weight:750}.nav-active{color:var(--green)!important}
@media(max-width:420px){main{padding:0 16px}.topbar{padding-left:16px;padding-right:16px}h2{font-size:29px}.today-card{padding:21px}}
.pullup-figure{animation:pullupBob 1.1s ease-in-out infinite;transform-origin:center}
@keyframes pullupBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.squat-figure{animation:squatBob 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes squatBob{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.78)}}
.rest-figure{animation:restBreathe 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes restBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.rest-aura{animation:restPulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes restPulse{0%{transform:scale(.8);opacity:.45}70%,100%{transform:scale(1.2);opacity:0}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div><div id="headerDate" class="date-label"></div><h1>Fitness</h1></div>
  <button id="themeBtn" class="icon-btn" onclick="toggleTheme()">☀️</button>
</header>

<main>
<section id="homeScreen" class="screen">
  <div class="week-progress-card">
    <div class="progress-header"><strong>This week</strong><span id="weekProgressText">0 / 4 workouts</span></div>
    <div class="progress-track"><div id="weekProgressBar" class="progress-bar"></div></div>
  </div>

  <div class="today-heading"><div class="eyebrow">TODAY'S PLAN</div><h2 id="todayHeadline"></h2></div>
  <div id="todayWorkoutContainer"></div>

  <div class="section-heading"><h3>Workout schedule</h3><p>Monday & Thursday · Lower Body · Tuesday & Friday · Upper Body</p></div>
  <div class="workout-grid">
    <button class="workout-small" onclick="openWorkout('lowerMon')"><div class="workout-icon"><svg viewBox="0 0 40 40" width="1em" height="1em" style="display:block" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g class="squat-figure"><circle cx="8" cy="14" r="3" fill="currentColor"/><circle cx="32" cy="14" r="3" fill="currentColor"/><line x1="8" y1="14" x2="32" y2="14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="20" cy="8" r="3.5" fill="currentColor"/><line x1="20" y1="14" x2="20" y2="24" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line x1="20" y1="24" x2="14" y2="36" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><line x1="20" y1="24" x2="26" y2="36" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></g></svg></div><h3>Monday</h3><p>Lower Body</p></button>
    <button class="workout-small" onclick="openWorkout('upperTue')"><div class="workout-icon"><svg viewBox="0 0 40 40" width="1em" height="1em" style="display:block" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><line x1="4" y1="7" x2="36" y2="7" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><g class="pullup-figure"><line x1="13" y1="9" x2="18" y2="17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><line x1="27" y1="9" x2="22" y2="17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="20" cy="21" r="4.5" fill="currentColor"/><line x1="20" y1="25.5" x2="20" y2="32" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line x1="20" y1="32" x2="16.5" y2="37" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><line x1="20" y1="32" x2="23.5" y2="37" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></g></svg></div><h3>Tuesday</h3><p>Upper Body</p></button>
    <button class="workout-small" onclick="openWorkout('lowerThu')"><div class="workout-icon"><svg viewBox="0 0 40 40" width="1em" height="1em" style="display:block" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g class="squat-figure"><circle cx="8" cy="14" r="3" fill="currentColor"/><circle cx="32" cy="14" r="3" fill="currentColor"/><line x1="8" y1="14" x2="32" y2="14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="20" cy="8" r="3.5" fill="currentColor"/><line x1="20" y1="14" x2="20" y2="24" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line x1="20" y1="24" x2="14" y2="36" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><line x1="20" y1="24" x2="26" y2="36" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></g></svg></div><h3>Thursday</h3><p>Lower Body</p></button>
    <button class="workout-small" onclick="openWorkout('upperFri')"><div class="workout-icon"><svg viewBox="0 0 40 40" width="1em" height="1em" style="display:block" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><line x1="4" y1="7" x2="36" y2="7" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><g class="pullup-figure"><line x1="13" y1="9" x2="18" y2="17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><line x1="27" y1="9" x2="22" y2="17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="20" cy="21" r="4.5" fill="currentColor"/><line x1="20" y1="25.5" x2="20" y2="32" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line x1="20" y1="32" x2="16.5" y2="37" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><line x1="20" y1="32" x2="23.5" y2="37" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></g></svg></div><h3>Friday</h3><p>Upper Body</p></button>
  </div>
</section>

<section id="workoutScreen" class="screen hidden">
  <div class="workout-header">
    <button class="back-btn" onclick="goHome()">←</button>
    <div class="workout-header-icon" id="workoutHeaderIcon"></div>
    <div><div id="workoutTypeLabel" class="eyebrow"></div><h2 id="workoutTitle"></h2></div>
  </div>
  <div class="progress-card">
    <div class="progress-header"><strong>Workout progress</strong><span id="workoutProgressText">0 / 0</span></div>
    <div class="progress-track"><div id="workoutProgressBar" class="progress-bar"></div></div>
  </div>
  <div id="exerciseList" class="exercise-list"></div>
  <button id="completeWorkoutButton" class="complete-btn" onclick="completeWorkout()">Complete Workout ✓</button>
  <button class="save-exit-btn" onclick="goHome()">Save & exit</button>
</section>

<section id="historyScreen" class="screen hidden">
  <div class="history-header">
    <div><div class="eyebrow">PROGRESS</div><h2>History</h2></div>
    <button class="back-btn" onclick="goHome()">×</button>
  </div>
  <div class="summary-card">
    <div class="summary-label">Last 12 weeks</div>
    <div class="summary-row">
      <div><span id="totalWorkouts" class="big-number">0</span><span class="summary-unit">workouts</span></div>
      <div class="streak"><strong id="currentStreak">0</strong><span>active weeks</span></div>
    </div>
  </div>
  <div class="section-heading"><h3>Calendar</h3></div>
  <div id="calendarContainer"></div>
  <div class="section-heading"><h3>Weekly activity</h3></div>
  <div id="weeklyChart"></div>
  <div class="section-heading"><h3>Workout history</h3></div>
  <div id="historyList"></div>
</section>
</main>

<nav class="bottom-nav">
  <button onclick="goHome()"><span id="navHomeIcon" class="nav-active">●</span><small>Workout</small></button>
  <button onclick="showHistory()"><span id="navHistoryIcon">▦</span><small>History</small></button>
</nav>
</div>

<div id="videoModal" class="video-modal hidden" onclick="closeVideoModal()">
  <button class="video-modal-close" onclick="closeVideoModal()">✕</button>
  <div id="videoModalContent" onclick="event.stopPropagation()"></div>
</div>

<script>
const WORKOUTS={
  lowerMon:{title:"Lower Body",day:"Monday",exercises:[
    {id:"barbell_squats",title:"Barbell Squats",youtube:"https://youtu.be/vOsvDTv19PA?si=Ow_zmpbbkrTKP8px",sets:3,reps:8},
    {id:"leg_press_mon",title:"Leg Press",youtube:"https://youtu.be/zWv-G9thuII?si=cYRnJCjkKr5SvNPt",sets:3,reps:10},
    {id:"hip_abduction",title:"Hip Abduction",youtube:"https://youtu.be/32INI1EFi7c?si=_j-aV53OMmJBGPM6",sets:3,reps:12},
    {id:"leg_extension_mon",title:"Leg Extension",youtube:"https://youtu.be/clRfR2IEXRw?si=vkCgrbJHxVw6Ma5u",sets:3,reps:12},
    {id:"lying_hamstring_curl_mon",title:"Lying Down Hamstring Curl",youtube:"https://youtu.be/d0jvb6CX0VI?si=5uTErPuKOVfS5qkn",sets:3,reps:12},
    {id:"smith_calf_raise_mon",title:"Smith Machine Calf Raise",youtube:"https://youtu.be/4eEwF_MnFAw?si=tU5RHf6wYR0wx7Bv",sets:3,reps:15}
  ]},
  upperTue:{title:"Upper Body",day:"Tuesday",exercises:[
    {id:"flat_bench_press",title:"Flat Bench Press",youtube:"https://youtu.be/0ewIJJKaTsY?si=gOX_1kgNXvEdC3Ck",sets:3,reps:8},
    {id:"pec_deck_fly",title:"Pec Deck Fly",youtube:"https://youtu.be/uo829803V4U?si=5FKZPbTHCeJzcJOJ",sets:3,reps:12},

function dateKey(date=new Date()){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`}
function dateFromKey(key){const [y,m,d]=key.split("-").map(Number);return new Date(y,m-1,d)}
function formatDate(date){return date.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})}
function formatShortDate(date){return date.toLocaleDateString("en-IN",{month:"short",day:"numeric"})}
function escapeHtml(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}

function storageKey(date,type){return `fitness_${date}_${type}`}
function getWorkoutData(date,type){
  const raw=localStorage.getItem(storageKey(date,type));
  if(!raw)return null;
  try{return JSON.parse(raw)}catch{return null}
}
function saveWorkoutData(date,type,data){localStorage.setItem(storageKey(date,type),JSON.stringify(data))}

function normalizeExercise(saved,exercise){
  if(!saved)return {id:exercise.id,sets:makeDefaultSets(exercise.reps,exercise.sets),completed:false};
  if(Array.isArray(saved.setsData))return {...saved,setsData:saved.setsData.map(s=>({reps:s.reps??"",weight:s.weight??""}))};
  // Migrate the old one-row format into the new per-set format.
  const count=Number(saved.sets)||exercise.sets||3;
  const reps=saved.reps??exercise.reps??"";
  const weight=saved.weight??"";
  return {...saved,setsData:Array.from({length:Math.max(1,count)},()=>({reps,weight}))};
}
function makeDefaultSets(reps,count=3){return Array.from({length:Math.max(1,count)},()=>({reps:"",weight:""}))}
function ensureWorkoutData(date,type){
  let data=getWorkoutData(date,type);
  if(!data)data={type,date,completed:false,exercises:[]};
  data.exercises=(data.exercises||[]).map(saved=>{
    const def=WORKOUTS[type].exercises.find(e=>e.id===saved.id);
    return def?normalizeExercise(saved,def):saved;
  });
  return data;
}

function getYouTubeVideoId(url){
  if(!url)return "";
  try{
    const u=new URL(url);
    if(u.hostname.includes("youtube.com")){
      if(u.searchParams.get("v"))return u.searchParams.get("v");
      const path=u.pathname;
      return path.split("/embed/")[1]?.split("/")[0]
        ||path.split("/shorts/")[1]?.split("/")[0]
        ||path.split("/live/")[1]?.split("/")[0]
        ||"";
    }
    if(u.hostname==="youtu.be")return u.pathname.substring(1).split("/")[0];
  }catch{}
  return "";
}

function getMondayOfWeek(date){const d=new Date(date);const dow=d.getDay();const diff=dow===0?-6:1-dow;d.setDate(d.getDate()+diff);d.setHours(0,0,0,0);return d}
function renderWeekProgress(){
  const monday=getMondayOfWeek(new Date());
  const weekKeys=[];
  for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(monday.getDate()+i);weekKeys.push(dateKey(d));}
  // Count each scheduled workout type once, crediting it if it was completed on ANY day
  // this week (not just its usual weekday) - workouts done on a swapped day still count.
  const scheduledTypes=[...new Set(Object.values(WEEKLY_SCHEDULE).filter(Boolean))];
  const total=scheduledTypes.length;
  const completed=scheduledTypes.filter(type=>weekKeys.some(k=>getWorkoutData(k,type)?.completed)).length;
  document.getElementById("weekProgressText").textContent=`${completed} / ${total} workouts`;
  document.getElementById("weekProgressBar").style.width=`${total?completed/total*100:0}%`;
}

function setRowHtml(id,index,s){
  return `<div class="set-row" data-set-index="${index}">

    <input type="number" min="0" step="0.5" inputmode="decimal" placeholder="kg" value="${escapeHtml(s.weight??"")}" onchange="saveSetField('${id}',${index},'weight',this.value)">
  </div>`;
}

function getOrCreateExercise(exerciseId){
  const data=ensureWorkoutData(dateKey(),currentWorkout);
  let ex=data.exercises.find(e=>e.id===exerciseId);
  const def=WORKOUTS[currentWorkout].exercises.find(e=>e.id===exerciseId);
  if(!ex){ex={id:exerciseId,setsData:makeDefaultSets(def.reps,3),completed:false};data.exercises.push(ex)}
  if(!Array.isArray(ex.setsData))ex.setsData=makeDefaultSets(def.reps,3);
  saveWorkoutData(dateKey(),currentWorkout,data);return {data,ex};
}

function saveSetField(exerciseId,index,field,value){
  const {data,ex}=getOrCreateExercise(exerciseId);
  while(ex.setsData.length<=index)ex.setsData.push({reps:"",weight:""});
  ex.setsData[index][field]=value===""?"":Number(value);
  saveWorkoutData(dateKey(),currentWorkout,data);
}

function addSet(exerciseId){
  const {data,ex}=getOrCreateExercise(exerciseId);
  // New rows start blank, so the user enters the actual reps/weight for each set.
  ex.setsData.push({reps:"",weight:""});
  saveWorkoutData(dateKey(),currentWorkout,data);renderExercises();
  const c=document.getElementById(`sets_${exerciseId}`);if(c)c.lastElementChild?.scrollIntoView({behavior:"smooth",block:"center"});

function removeSet(exerciseId){

function getExerciseVariants(title){
  // Same exercise (e.g. "Leg Press") is stored under a different id/type per
  // scheduled day (leg_press_mon vs leg_press_thu). Collect every {type,id}
  // that shares this title so history can include all of them.
  const variants=[];
  for(const t of Object.keys(WORKOUTS)){
    const def=WORKOUTS[t].exercises.find(e=>e.title===title);
    if(def)variants.push({type:t,id:def.id});
  }
  return variants;
}
function getExerciseHistory(exerciseId,type=currentWorkout){
  const sourceDef=WORKOUTS[type]?.exercises.find(e=>e.id===exerciseId);
  if(!sourceDef)return [];
  const variants=getExerciseVariants(sourceDef.title);
  const result=[];
  const today=dateFromKey(dateKey());
  for(let i=0;i<84;i++){
    const d=new Date(today);d.setDate(today.getDate()-i);
    const key=dateKey(d);
    for(const v of variants){
      const data=getWorkoutData(key,v.type);if(!data)continue;
      const ex=data.exercises?.find(e=>e.id===v.id);if(!ex)continue;
      const def=WORKOUTS[v.type].exercises.find(e=>e.id===v.id);if(!def)continue;
      const normalized=normalizeExercise(ex,def);
      const sets=(normalized.setsData||[]).filter(s=>s.reps!==""||s.weight!=="");
      if(sets.length)result.push({date:key,day:WORKOUTS[v.type].day,sets});
    }
  }
  return result;
}

function renderExerciseHistoryHtml(exerciseId){
  const history=getExerciseHistory(exerciseId);
  if(!history.length)return `<h4>Exercise history</h4><div class="history-line">No history yet.</div>`;
  return `<h4>Exercise history · 12 weeks</h4>`+history.map(h=>{
    const reps=h.sets.map(s=>s.reps===""?"—":s.reps).join(", ");
    const weights=h.sets.map(s=>s.weight===""?"—":s.weight).join(", ");
    return `<div class="history-entry"><div class="history-date">${formatDate(dateFromKey(h.date))}${h.day?` · ${h.day}`:""}</div><div class="history-line">Sets: ${h.sets.length}<br>Reps: ${reps}<br>Weight: ${weights} kg</div></div>`;
  }).join("");
}

/* 12-week overall history */
function getLast12WeeksWorkouts(){
  const result=[],today=dateFromKey(dateKey());
  for(let i=0;i<84;i++){
    const d=new Date(today);d.setDate(today.getDate()-i);const key=dateKey(d);
    for(const type of Object.keys(WORKOUTS)){
      const data=getWorkoutData(key,type);if(data?.completed)result.push({date:key,type,data});
    }
  }
  return result;
}
const MONTH_NAMES=["January","February","March","April","May","June","July","August","September","October","November","December"];
function dateHasCompletedWorkout(key){return Object.keys(WORKOUTS).some(type=>getWorkoutData(key,type)?.completed)}
function renderCalendarMonth(year,month){
  const todayKey=dateKey();
  const firstDay=new Date(year,month,1),daysInMonth=new Date(year,month+1,0).getDate();
  // Monday-first offset: getDay() 0=Sun..6=Sat -> convert so Mon=0..Sun=6
  const leadingEmpty=(firstDay.getDay()+6)%7;
  let cells="";
  for(let i=0;i<leadingEmpty;i++)cells+=`<div class="calendar-day empty"></div>`;
  for(let day=1;day<=daysInMonth;day++){
    const d=new Date(year,month,day),key=dateKey(d);
    const isToday=key===todayKey,hasWorkout=dateHasCompletedWorkout(key);
    cells+=`<div class="calendar-day${isToday?" today":""}"><span class="day-num">${day}</span><span class="dot${hasWorkout?"":" empty-dot"}"></span></div>`;
  }
  return `<div class="calendar-block">
    <div class="calendar-month-label">${MONTH_NAMES[month]} ${year}</div>
    <div class="calendar-weekdays"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
    <div class="calendar-grid">${cells}</div>
  </div>`;
}
function renderCalendar(){
  const c=document.getElementById("calendarContainer");if(!c)return;
  const today=new Date();let html="";
  for(let i=0;i<3;i++){
    const d=new Date(today.getFullYear(),today.getMonth()-i,1);
    html+=renderCalendarMonth(d.getFullYear(),d.getMonth());
  }
  c.innerHTML=html;
}
function renderHistory(){
  const workouts=getLast12WeeksWorkouts();document.getElementById("totalWorkouts").textContent=workouts.length;renderWeeklyChart();renderCalendar();
  const c=document.getElementById("historyList");c.innerHTML="";
  if(!workouts.length){c.innerHTML=`<div class="history-card"><strong>No workout history</strong><div class="history-info"><span>Your completed workouts will appear here.</span></div></div>`;return}
  workouts.forEach(w=>{
    const card=document.createElement("button");card.className="history-card";card.onclick=()=>openHistoricalWorkout(w);
    const completed=w.data.exercises?.filter(e=>e.completed).length||0,total=WORKOUTS[w.type].exercises.length;
    card.innerHTML=`<div class="history-row"><div class="history-icon">${w.type.startsWith("upper")?PULLUP_ICON_SVG:SQUAT_ICON_SVG}</div><div class="history-info"><strong>${WORKOUTS[w.type].title}</strong><span>${formatShortDate(dateFromKey(w.date))} · ${completed}/${total} exercises</span></div><div class="history-arrow">›</div></div>`;
    c.appendChild(card);
  });
}
function renderWeeklyChart(){
  const c=document.getElementById("weeklyChart");c.innerHTML="";const today=dateFromKey(dateKey());
  for(let week=0;week<12;week++){
    let count=0;for(let day=0;day<7;day++){const d=new Date(today);d.setDate(today.getDate()-week*7-day);const k=dateKey(d);for(const type of Object.keys(WORKOUTS)){if(getWorkoutData(k,type)?.completed)count++}}
    const start=new Date(today);start.setDate(today.getDate()-week*7-6);const end=new Date(today);end.setDate(today.getDate()-week*7);
    const row=document.createElement("div");row.className="week-row";row.innerHTML=`<div class="week-label">Week ${12-week}</div><div class="week-bar-container">${count?`<div class="week-bar" style="width:${Math.max(count/4*100,15)}%">${count}</div>`:""}</div><div class="week-dates">${formatShortDate(start)} – ${formatShortDate(end)}</div>`;c.appendChild(row);
  }
  document.getElementById("currentStreak").textContent=calculateWeekStreak();
}
function calculateWeekStreak(){
  const today=dateFromKey(dateKey());let streak=0;
  for(let week=0;week<12;week++){let found=false;for(let day=0;day<7;day++){const d=new Date(today);d.setDate(today.getDate()-week*7-day);const k=dateKey(d);if(Object.keys(WORKOUTS).some(type=>getWorkoutData(k,type)?.completed)){found=true;break}}if(found)streak++;else break}
  return streak;
}
function showHistory(){hideScreens();document.getElementById("historyScreen").classList.remove("hidden");renderHistory();setNav("history");window.scrollTo(0,0)}

function openHistoricalWorkout(workout){
  currentWorkout=workout.type;viewingHistoricalWorkout=true;historicalWorkoutDate=workout.date;hideScreens();
  document.getElementById("workoutScreen").classList.remove("hidden");
  applyWorkoutAccent(workout.type);
  document.getElementById("workoutTypeLabel").textContent=`${WORKOUTS[workout.type].day} · ${formatDate(dateFromKey(workout.date))}`;
  document.getElementById("workoutTitle").textContent=WORKOUTS[workout.type].title;
  document.getElementById("completeWorkoutButton").classList.add("hidden");
  renderHistoricalExercises(workout);window.scrollTo(0,0);
}
function renderHistoricalExercises(workout){
  const c=document.getElementById("exerciseList");c.innerHTML="";
  WORKOUTS[workout.type].exercises.forEach((exercise,index)=>{
    const saved=workout.data.exercises?.find(e=>e.id===exercise.id),normalized=normalizeExercise(saved,exercise);
    const card=document.createElement("div");card.className="exercise-card";
    const sets=normalized.setsData||[];
    card.innerHTML=`<div class="exercise-title-row"><div class="exercise-number">${index+1}</div><div class="exercise-title">${escapeHtml(exercise.title)}</div></div>
      <div class="target-box"><span class="target-label">Logged</span><span class="target-value">${sets.length} sets</span></div>
      ${sets.map((s,i)=>`<div class="set-row"><div class="set-number">SET ${i+1}</div><div class="set-number">${s.reps===""?"—":s.reps} reps</div><div class="set-number">${s.weight===""?"—":s.weight} kg</div></div>`).join("")}
      ${saved?.completed?`<div class="exercise-complete done">✓ Completed</div>`:""}`;
    c.appendChild(card);
  });
  updateWorkoutProgress();
}

function toggleTheme(){
  const dark=document.documentElement.classList.toggle("dark");localStorage.setItem("fitness_theme",dark?"dark":"light");document.getElementById("themeBtn").textContent=dark?"🌙":"☀️";
}
function initializeTheme(){
  const saved=localStorage.getItem("fitness_theme"),dark=saved==="dark"||(!saved&&window.matchMedia("(prefers-color-scheme: dark)").matches);
  if(dark){document.documentElement.classList.add("dark");document.getElementById("themeBtn").textContent="🌙"}
}
function renderHeader(){document.getElementById("headerDate").textContent=new Date().toLocaleDateString("en-IN",{weekday:"long",month:"short",day:"numeric"})}

initializeTheme();renderHeader();goHome();
</script>
