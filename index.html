<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fitness">

<title>Fitness Tracker</title>

<style>

/* =========================================================
   RESET / VARIABLES
   ========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg: #f5f7f9;
  --card: #ffffff;
  --text: #111827;
  --muted: #6b7280;
  --border: #e5e7eb;
  --soft: #f1f5f9;

  --green: #16a34a;
  --green-dark: #15803d;
  --green-light: #dcfce7;

  --blue: #2563eb;
  --blue-dark: #1d4ed8;

  --danger: #dc2626;
}

html.dark {
  --bg: #020617;
  --card: #0f172a;
  --text: #f8fafc;
  --muted: #94a3b8;
  --border: #1e293b;
  --soft: #1e293b;
}

html,
body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    Helvetica,
    Arial,
    sans-serif;
}

body {
  min-height: 100vh;
}

button,
input {
  font-family: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

.hidden {
  display: none !important;
}


/* =========================================================
   APP
   ========================================================= */

.app {
  width: 100%;
  max-width: 650px;
  min-height: 100vh;
  margin: 0 auto;

  padding-bottom:
    calc(95px + env(safe-area-inset-bottom));
}


/* =========================================================
   HEADER
   ========================================================= */

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding:
    max(24px, env(safe-area-inset-top) + 10px)
    20px
    12px;
}

.date-label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}

.topbar h1 {
  margin: 4px 0 0;

  font-size: 30px;
  line-height: 1;

  letter-spacing: -0.04em;
}

.icon-btn {
  width: 42px;
  height: 42px;

  border-radius: 50%;

  background: var(--card);
  color: var(--text);

  box-shadow:
    0 2px 8px rgba(0,0,0,.08);

  font-size: 18px;
}


/* =========================================================
   MAIN
   ========================================================= */

main {
  padding: 0 20px;
}

.screen {
  animation: fadeIn .18s ease-out;
}

@keyframes fadeIn {

  from {
    opacity: 0;
    transform: translateY(5px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}


/* =========================================================
   HEADINGS
   ========================================================= */

.today-heading {
  padding-top: 22px;
  margin-bottom: 20px;
}

.eyebrow {
  color: var(--muted);

  font-size: 11px;
  font-weight: 800;

  letter-spacing: .11em;
}

h2 {
  margin: 5px 0 0;

  font-size: 32px;
  line-height: 1.08;

  letter-spacing: -.04em;
}

.section-heading {
  margin-top: 32px;
  margin-bottom: 12px;
}

.section-heading h3 {
  margin: 0;

  font-size: 19px;
}

.section-heading p {
  margin: 4px 0 0;

  color: var(--muted);

  font-size: 13px;
}

.section-heading-row {
  display: flex;

  justify-content: space-between;
  align-items: center;
}


/* =========================================================
   TODAY WORKOUT
   ========================================================= */

.today-card {
  position: relative;

  display: block;

  width: 100%;

  overflow: hidden;

  padding: 24px;

  border-radius: 27px;

  color: white;

  text-align: left;

  box-shadow:
    0 12px 30px rgba(0,0,0,.13);

  transition:
    transform .12s;
}

.today-card:active {
  transform: scale(.98);
}

.today-card.upper {
  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--blue-dark)
    );
}

.today-card.lower {
  background:
    linear-gradient(
      135deg,
      var(--green),
      var(--green-dark)
    );
}

.today-card.rest {
  background:
    linear-gradient(
      135deg,
      #334155,
      #0f172a
    );
}

.today-icon {
  display: flex;

  width: 58px;
  height: 58px;

  align-items: center;
  justify-content: center;

  border-radius: 18px;

  background:
    rgba(255,255,255,.14);

  font-size: 30px;
}

.today-card h3 {
  margin: 18px 0 4px;

  font-size: 28px;

  letter-spacing: -.03em;
}

.today-card p {
  margin: 0;

  color:
    rgba(255,255,255,.78);

  font-size: 13px;
}

.today-footer {
  display: flex;

  justify-content: space-between;
  align-items: center;

  gap: 10px;

  margin-top: 28px;
}

.today-meta {
  color:
    rgba(255,255,255,.72);

  font-size: 12px;
}

.start-pill {
  flex-shrink: 0;

  padding: 9px 13px;

  border-radius: 12px;

  background:
    rgba(255,255,255,.16);

  color: white;

  font-size: 12px;
  font-weight: 800;
}


/* =========================================================
   TODAY RIBBON
   ========================================================= */

.ribbon {
  position: absolute;

  top: 17px;
  right: -35px;

  width: 130px;

  padding: 6px 0;

  transform: rotate(45deg);

  background: white;
  color: #111827;

  text-align: center;

  font-size: 10px;
  font-weight: 900;

  letter-spacing: .08em;

  box-shadow:
    0 2px 6px rgba(0,0,0,.15);
}


/* =========================================================
   WORKOUT SELECTOR
   ========================================================= */

.workout-grid {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 12px;
}

.workout-small {
  padding: 19px;

  border-radius: 21px;

  background: var(--card);
  color: var(--text);

  text-align: left;

  border: 1px solid var(--border);

  box-shadow:
    0 2px 8px rgba(0,0,0,.04);

  transition:
    transform .12s;
}

.workout-small:active {
  transform: scale(.97);
}

.workout-icon {
  font-size: 28px;
}

.workout-small h3 {
  margin: 12px 0 3px;

  font-size: 16px;
}

.workout-small p {
  margin: 0;

  color: var(--muted);

  font-size: 12px;
}


/* =========================================================
   LAST WORKOUT
   ========================================================= */

.text-button {
  background: transparent;

  color: var(--green);

  font-size: 13px;
  font-weight: 800;
}

.last-card {
  width: 100%;

  padding: 17px;

  border-radius: 20px;

  background: var(--card);
  color: var(--text);

  text-align: left;

  border: 1px solid var(--border);
}

.last-row {
  display: flex;

  align-items: center;

  gap: 13px;
}

.last-icon {
  display: flex;

  width: 46px;
  height: 46px;

  flex-shrink: 0;

  align-items: center;
  justify-content: center;

  border-radius: 14px;

  background: var(--soft);

  font-size: 22px;
}

.last-info {
  flex: 1;
}

.last-info strong {
  display: block;

  font-size: 14px;
}

.last-info span {
  display: block;

  margin-top: 3px;

  color: var(--muted);

  font-size: 12px;
}


/* =========================================================
   WORKOUT HEADER
   ========================================================= */

.workout-header {
  display: flex;

  align-items: center;

  gap: 13px;

  padding-top: 10px;
}

.back-btn {
  display: flex;

  width: 42px;
  height: 42px;

  flex-shrink: 0;

  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background: var(--card);
  color: var(--text);

  font-size: 24px;

  box-shadow:
    0 2px 7px rgba(0,0,0,.08);
}


/* =========================================================
   PROGRESS
   ========================================================= */

.progress-card {
  margin-top: 20px;

  padding: 17px;

  border-radius: 20px;

  background: var(--card);

  border: 1px solid var(--border);
}

.progress-header {
  display: flex;

  justify-content: space-between;

  font-size: 13px;
}

.progress-header span {
  color: var(--muted);
}

.progress-track {
  height: 7px;

  margin-top: 12px;

  overflow: hidden;

  border-radius: 10px;

  background: var(--soft);
}

.progress-bar {
  width: 0;
  height: 100%;

  border-radius: inherit;

  background: var(--green);

  transition:
    width .25s ease;
}


/* =========================================================
   EXERCISES
   ========================================================= */

.exercise-list {
  display: flex;

  flex-direction: column;

  gap: 16px;

  margin-top: 16px;
}

.exercise-card {
  padding: 18px;

  border-radius: 24px;

  background: var(--card);

  border: 1px solid var(--border);

  box-shadow:
    0 2px 9px rgba(0,0,0,.04);
}

.exercise-title-row {
  display: flex;

  align-items: center;

  gap: 12px;
}

.exercise-number {
  display: flex;

  width: 38px;
  height: 38px;

  flex-shrink: 0;

  align-items: center;
  justify-content: center;

  border-radius: 12px;

  background: var(--soft);

  color: var(--muted);

  font-size: 13px;
  font-weight: 900;
}

.exercise-title {
  font-size: 17px;
  font-weight: 850;

  letter-spacing: -.01em;
}


/* =========================================================
   VIDEO
   ========================================================= */

.video-section {
  margin-top: 15px;
}

.video-placeholder {
  position: relative;

  display: flex;

  width: 100%;

  aspect-ratio: 16 / 9;

  align-items: center;
  justify-content: center;

  overflow: hidden;

  border-radius: 17px;

  background:
    linear-gradient(
      135deg,
      #111827,
      #020617
    );

  color: white;

  cursor: pointer;
}

.video-placeholder .play {
  display: flex;

  width: 58px;
  height: 58px;

  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background: #ef4444;

  font-size: 25px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.3);
}

.video-placeholder .video-label {
  position: absolute;

  bottom: 13px;
  left: 15px;

  color:
    rgba(255,255,255,.75);

  font-size: 11px;
  font-weight: 700;
}

.video-frame {
  position: relative;

  width: 100%;

  aspect-ratio: 16 / 9;

  overflow: hidden;

  border-radius: 17px;

  background: #000;
}

.video-frame iframe {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  border: 0;
}


/* =========================================================
   TARGET
   ========================================================= */

.target-box {
  display: flex;

  align-items: center;
  justify-content: space-between;

  margin-top: 14px;

  padding: 13px;

  border-radius: 15px;

  background: var(--soft);
}

.target-label {
  color: var(--muted);

  font-size: 12px;
}

.target-value {
  font-size: 14px;
  font-weight: 850;
}


/* =========================================================
   INPUTS
   ========================================================= */

.input-label {
  display: block;

  margin-top: 15px;

  color: var(--muted);

  font-size: 10px;
  font-weight: 850;

  letter-spacing: .08em;
}

.input-grid {
  display: grid;

  grid-template-columns:
    1fr 1fr 1fr;

  gap: 8px;

  margin-top: 7px;
}

.input-wrapper {
  text-align: center;
}

.input-wrapper input {
  width: 100%;

  padding: 12px 5px;

  border: 1px solid var(--border);

  border-radius: 13px;

  outline: none;

  background: var(--soft);
  color: var(--text);

  text-align: center;

  font-size: 17px;
  font-weight: 800;
}

.input-wrapper input:focus {
  border-color: var(--green);
}

.input-caption {
  margin-top: 4px;

  color: var(--muted);

  font-size: 9px;
  font-weight: 800;
}


/* =========================================================
   EXERCISE COMPLETE
   ========================================================= */

.exercise-complete {
  width: 100%;

  margin-top: 13px;

  padding: 11px;

  border-radius: 13px;

  background: var(--soft);

  color: var(--muted);

  font-size: 12px;
  font-weight: 850;
}

.exercise-complete.done {
  background: var(--green-light);

  color: var(--green-dark);
}

html.dark .exercise-complete.done {
  background: rgba(22,163,74,.18);

  color: #4ade80;
}


/* =========================================================
   COMPLETE WORKOUT
   ========================================================= */

.complete-btn {
  width: 100%;

  margin-top: 18px;

  padding: 17px;

  border-radius: 18px;

  background: var(--green);

  color: white;

  font-size: 15px;
  font-weight: 850;

  box-shadow:
    0 8px 20px rgba(22,163,74,.22);
}

.save-exit-btn {
  display: block;

  width: 100%;

  padding: 14px;

  background: transparent;

  color: var(--muted);

  font-size: 13px;
  font-weight: 700;
}


/* =========================================================
   HISTORY
   ========================================================= */

.history-header {
  display: flex;

  align-items: center;
  justify-content: space-between;

  padding-top: 10px;
}

.summary-card {
  margin-top: 22px;

  padding: 20px;

  border-radius: 24px;

  background: #0f172a;

  color: white;
}

.summary-label {
  color: #94a3b8;

  font-size: 12px;
}

.summary-row {
  display: flex;

  align-items: flex-end;
  justify-content: space-between;

  margin-top: 5px;
}

.big-number {
  font-size: 42px;
  font-weight: 900;
}

.summary-unit {
  margin-left: 4px;

  color: #94a3b8;

  font-size: 12px;
}

.streak {
  text-align: right;
}

.streak strong {
  display: block;

  color: #4ade80;

  font-size: 22px;
}

.streak span {
  color: #94a3b8;

  font-size: 10px;
}


/* =========================================================
   WEEKLY CHART
   ========================================================= */

.week-row {
  display: flex;

  align-items: center;

  gap: 9px;

  margin-bottom: 10px;
}

.week-label {
  width: 48px;

  flex-shrink: 0;

  color: var(--muted);

  font-size: 10px;
}

.week-bar-container {
  flex: 1;

  height: 25px;

  overflow: hidden;

  border-radius: 8px;

  background: var(--soft);
}

.week-bar {
  display: flex;

  height: 100%;

  min-width: 0;

  align-items: center;

  padding-left: 7px;

  border-radius: 8px;

  background: var(--green);

  color: white;

  font-size: 9px;
  font-weight: 850;
}

.week-dates {
  width: 82px;

  flex-shrink: 0;

  color: var(--muted);

  text-align: right;

  font-size: 8px;
}


/* =========================================================
   HISTORY LIST
   ========================================================= */

.history-list-heading {
  margin-top: 28px;
}

.history-card {
  width: 100%;

  margin-bottom: 9px;

  padding: 14px;

  border-radius: 18px;

  background: var(--card);

  border: 1px solid var(--border);

  color: var(--text);

  text-align: left;
}

.history-row {
  display: flex;

  align-items: center;

  gap: 12px;
}

.history-icon {
  display: flex;

  width: 43px;
  height: 43px;

  flex-shrink: 0;

  align-items: center;
  justify-content: center;

  border-radius: 13px;

  background: var(--soft);

  font-size: 21px;
}

.history-info {
  flex: 1;
}

.history-info strong {
  display: block;

  font-size: 14px;
}

.history-info span {
  display: block;

  margin-top: 3px;

  color: var(--muted);

  font-size: 11px;
}

.history-arrow {
  color: var(--muted);

  font-size: 22px;
}


/* =========================================================
   BOTTOM NAV
   ========================================================= */

.bottom-nav {
  position: fixed;

  z-index: 50;

  right: 0;
  bottom: 0;
  left: 0;

  display: flex;

  justify-content: center;

  padding:
    10px
    0
    max(12px, env(safe-area-inset-bottom));

  background:
    rgba(255,255,255,.92);

  border-top: 1px solid var(--border);

  backdrop-filter:
    blur(15px);
}

html.dark .bottom-nav {
  background:
    rgba(15,23,42,.92);
}

.bottom-nav button {
  display: flex;

  width: 120px;

  flex-direction: column;

  align-items: center;

  gap: 3px;

  background: transparent;

  color: var(--muted);
}

.bottom-nav button span {
  font-size: 19px;
}

.bottom-nav button small {
  font-size: 10px;
  font-weight: 750;
}

.nav-active {
  color: var(--green) !important;
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 420px) {

  main {
    padding: 0 16px;
  }

  .topbar {
    padding-left: 16px;
    padding-right: 16px;
  }

  h2 {
    font-size: 29px;
  }

  .today-card {
    padding: 21px;
  }

}

</style>
</head>


<body>

<div class="app">


<!-- ======================================================
     HEADER
     ====================================================== -->

<header class="topbar">

  <div>

    <div
      id="headerDate"
      class="date-label">
    </div>

    <h1>
      Fitness
    </h1>

  </div>


  <button
    id="themeBtn"
    class="icon-btn"
    onclick="toggleTheme()">

    ☀️

  </button>

</header>



<main>


<!-- ======================================================
     HOME SCREEN
     ====================================================== -->

<section
  id="homeScreen"
  class="screen">


  <div class="today-heading">

    <div class="eyebrow">
      TODAY'S PLAN
    </div>

    <h2 id="todayHeadline">
    </h2>

  </div>


  <!-- TODAY'S WORKOUT -->

  <div
    id="todayWorkoutContainer">
  </div>


  <!-- OTHER WORKOUTS -->

  <div class="section-heading">

    <h3>
      Other workouts
    </h3>

    <p>
      Choose a different workout anytime.
    </p>

  </div>


  <div class="workout-grid">


    <button
      class="workout-small"
      onclick="openWorkout('upper')">

      <div class="workout-icon">
        💪
      </div>

      <h3>
        Upper Body
      </h3>

      <p>
        <span id="upperCount"></span>
        exercises
      </p>

    </button>


    <button
      class="workout-small"
      onclick="openWorkout('lower')">

      <div class="workout-icon">
        🦵
      </div>

      <h3>
        Lower Body
      </h3>

      <p>
        <span id="lowerCount"></span>
        exercises
      </p>

    </button>


  </div>


  <!-- LAST WORKOUT -->

  <div class="section-heading">

    <div class="section-heading-row">

      <h3>
        Last workout
      </h3>

      <button
        class="text-button"
        onclick="showHistory()">

        History

      </button>

    </div>

  </div>


  <div id="lastWorkout">
  </div>


</section>



<!-- ======================================================
     WORKOUT SCREEN
     ====================================================== -->

<section
  id="workoutScreen"
  class="screen hidden">


  <div class="workout-header">


    <button
      class="back-btn"
      onclick="goHome()">

      ←

    </button>


    <div>

      <div
        id="workoutTypeLabel"
        class="eyebrow">
      </div>

      <h2
        id="workoutTitle">
      </h2>

    </div>


  </div>


  <!-- PROGRESS -->

  <div class="progress-card">

    <div class="progress-header">

      <strong>
        Workout progress
      </strong>

      <span
        id="workoutProgressText">

        0 / 0

      </span>

    </div>


    <div class="progress-track">

      <div
        id="workoutProgressBar"
        class="progress-bar">
      </div>

    </div>

  </div>


  <!-- EXERCISES -->

  <div
    id="exerciseList"
    class="exercise-list">
  </div>


  <button
    id="completeWorkoutButton"
    class="complete-btn"
    onclick="completeWorkout()">

    Complete Workout ✓

  </button>


  <button
    class="save-exit-btn"
    onclick="goHome()">

    Save & exit

  </button>


</section>



<!-- ======================================================
     HISTORY SCREEN
     ====================================================== -->

<section
  id="historyScreen"
  class="screen hidden">


  <div class="history-header">

    <div>

      <div class="eyebrow">
        PROGRESS
      </div>

      <h2>
        History
      </h2>

    </div>


    <button
      class="back-btn"
      onclick="goHome()">

      ×

    </button>

  </div>


  <!-- SUMMARY -->

  <div class="summary-card">

    <div class="summary-label">
      Last 12 weeks
    </div>


    <div class="summary-row">

      <div>

        <span
          id="totalWorkouts"
          class="big-number">

          0

        </span>

        <span class="summary-unit">
          workouts
        </span>

      </div>


      <div class="streak">

        <strong
          id="currentStreak">

          0

        </strong>

        <span>
          active weeks
        </span>

      </div>

    </div>

  </div>


  <!-- WEEKLY ACTIVITY -->

  <div class="section-heading">

    <h3>
      Weekly activity
    </h3>

  </div>


  <div id="weeklyChart">
  </div>


  <!-- HISTORY -->

  <div class="section-heading history-list-heading">

    <h3>
      Workout history
    </h3>

  </div>


  <div id="historyList">
  </div>


</section>


</main>



<!-- ======================================================
     BOTTOM NAV
     ====================================================== -->

<nav class="bottom-nav">


  <button
    onclick="goHome()">

    <span
      id="navHomeIcon"
      class="nav-active">

      ●

    </span>

    <small>
      Workout

/* =========================================================
   WEEKLY SCHEDULE

   Sunday     REST
   Monday     LOWER
   Tuesday    UPPER
   Wednesday  REST
   Thursday   LOWER
   Friday     UPPER
   Saturday   REST
   ========================================================= */

const WEEKLY_SCHEDULE = {

  0: null,

  1: "lower",

  2: "upper",

  3: null,

  4: "lower",

  5: "upper",

  6: null

};


let currentWorkout = null;

let viewingHistoricalWorkout = false;

let historicalWorkoutDate = null;


/* =========================================================
   DATE FUNCTIONS
   ========================================================= */

function dateKey(date = new Date()) {

  const y =
    date.getFullYear();

  const m =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");

  const d =
    String(
      date.getDate()
    ).padStart(2, "0");

  return `${y}-${m}-${d}`;

}


function dateFromKey(key) {

  const parts =
    key.split("-");

  return new Date(
    Number(parts[0]),
    Number(parts[1]) - 1,
    Number(parts[2])
  );

}


function formatDate(date) {

  return date.toLocaleDateString(
    "en-IN",
    {
      weekday: "long",
      month: "short",
      day: "numeric"
    }
  );

}


function formatShortDate(date) {

  return date.toLocaleDateString(
    "en-IN",
    {
      month: "short",
      day: "numeric"
    }
  );

}


/* =========================================================
   STORAGE
   ========================================================= */

function storageKey(
  date,
  type
) {

  return `fitness_${date}_${type}`;

}


function getWorkoutData(
  date,
  type
) {

  const raw =
    localStorage.getItem(
      storageKey(date, type)
    );

  if (!raw) {
    return null;
  }

  try {

    return JSON.parse(raw);

  } catch {

    return null;

  }

}


function saveWorkoutData(
  date,
  type,
  data
) {

  localStorage.setItem(
    storageKey(date, type),
    JSON.stringify(data)
  );

}


/* =========================================================
   YOUTUBE
   ========================================================= */

function getYouTubeVideoId(url) {

  if (!url) {
    return "";
  }

  try {

    const parsed =
      new URL(url);

    if (
      parsed.hostname.includes(
        "youtube.com"
      )
    ) {

      const video =
        parsed.searchParams.get(
          "v"
        );

      if (video) {
        return video;
      }

      if (
        parsed.pathname.startsWith(
          "/embed/"
        )
      ) {

        return parsed.pathname
          .split("/embed/")[1]
          .split("/")[0];

      }

    }


    if (
      parsed.hostname ===
      "youtu.be"
    ) {

      return parsed.pathname
        .substring(1)
        .split("/")[0];

    }

  } catch {

  }

  return "";

}


function loadYouTube(
  exerciseId
) {

  const exercise =
    WORKOUTS[
      currentWorkout
    ].exercises.find(
      e =>
        e.id === exerciseId
    );

  if (!exercise) {
    return;
  }


  const container =
    document.getElementById(
      `video_${exerciseId}`
    );

  if (!container) {
    return;
  }


  const videoId =
    getYouTubeVideoId(
      exercise.youtube
    );


  container.innerHTML = `

    <div class="video-frame">

      <iframe

        src="https://www.youtube-nocookie.com/embed/${videoId}?playsinline=1&rel=0"

        title="${escapeHtml(
          exercise.title
        )}"

        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

        allowfullscreen>

      </iframe>

    </div>

  `;

}

}

function getWorkoutDuration(
  workout
) {

  const sets =
    workout.exercises.reduce(
      (sum, exercise) =>
        sum + exercise.sets,
      0
    );

  return Math.round(
    sets * 3
  );

}


function getNextWorkoutText() {

  const today =
    new Date();


  for (
    let i = 1;
    i <= 7;
    i++
  ) {

    date.setDate(
      today.getDate() + i
    );


    const type =
      WEEKLY_SCHEDULE[
        date.getDay()

    if (type) {

      return `

          "en-IN",
          {
            weekday: "long"
          }
        )}

        ${WORKOUTS[type].title}

    }

  }


  return "Workout";

}

/* =========================================================
   OPEN WORKOUT
   ========================================================= */

function openWorkout(
  type
) {

  currentWorkout =
    type;

  viewingHistoricalWorkout =
    false;

  historicalWorkoutDate =
    null;


  hideScreens();


  document
    .getElementById(
      "workoutScreen"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "workoutTypeLabel"
    )

    .getElementById(
      "workoutTitle"
    )

        type
      ].title;


  document
    .getElementById(
      "completeWorkoutButton"
    )
    .classList.remove(
      "hidden"
    );


  renderExercises();


  window.scrollTo(
    0,
    0
  );

}


/* =========================================================
   RENDER EXERCISES
   ========================================================= */

function renderExercises() {

  const container =
    document.getElementById(
      "exerciseList"
    );


  container.innerHTML =
    "";


  const workout =
    WORKOUTS[
      currentWorkout
    ];


  const saved =
    getWorkoutData(
      dateKey(),
      currentWorkout
    );


  workout.exercises.forEach(
    (
      exercise,
      index
    ) => {


      const savedExercise =
        saved?.exercises?.find(
          e =>
            e.id ===
            exercise.id
        );


      const previousWeight =
        getPreviousWeight(
          currentWorkout,
          exercise.id
        );


      const weight =
        savedExercise?.weight ??
        previousWeight ??
        "";


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "exercise-card";


      card.innerHTML = `

        <div class="exercise-title-row">

          <div class="exercise-number">
            ${index + 1}
          </div>

          <div class="exercise-title">

            ${escapeHtml(
              exercise.title
            )}

          </div>

        </div>


        <div
          id="video_${exercise.id}"
          class="video-section">

          <div
            class="video-placeholder"
            onclick="loadYouTube('${exercise.id}')">

            <div class="play">
              ▶
            </div>

            <div class="video-label">
              Tap to watch technique
            </div>

          </div>

        </div>


        <div class="target-box">

          <span class="target-label">
            Target
          </span>

          <span class="target-value">

            ${exercise.sets}
            ×
            ${exercise.reps}

          </span>

        </div>


        <label class="input-label">

          SETS × REPS × WEIGHT

        </label>


        <div class="input-grid">


          <div class="input-wrapper">

            <input
              id="${exercise.id}_sets"
              type="number"
              min="0"
              value="${
                savedExercise?.sets ??
                exercise.sets
              }"
              onchange="saveExerciseField(
                '${exercise.id}',
                'sets',
                this.value
              )">

            <div class="input-caption">
              SETS
            </div>

          </div>


          <div class="input-wrapper">

            <input
              id="${exercise.id}_reps"
              type="number"
              min="0"
              value="${
                savedExercise?.reps ??
                exercise.reps
              }"
              onchange="saveExerciseField(
                '${exercise.id}',
                'reps',
                this.value
              )">

            <div class="input-caption">
              REPS
            </div>

          </div>


          <div class="input-wrapper">

            <input
              id="${exercise.id}_weight"
              type="number"
              min="0"
              step="0.5"
              placeholder="—"
              value="${weight}"
              onchange="saveExerciseField(
                '${exercise.id}',
                'weight',
                this.value
              )">

            <div class="input-caption">
              KG
            </div>

          </div>


        </div>


        <button
          id="${exercise.id}_complete"
          class="exercise-complete ${
            savedExercise?.completed
              ? "done"
              : ""
          }"
          onclick="toggleExerciseComplete(
            '${exercise.id}'
          )">

          ${
            savedExercise?.completed
              ? "✓ Completed"
              : "Mark exercise complete"
          }

        </button>

      `;


      container.appendChild(
        card
      );

    }
  );


  updateWorkoutProgress();

}


/* =========================================================
   SAVE EXERCISE FIELD
   ========================================================= */

function saveExerciseField(
  exerciseId,
  field,
  value
) {

  const today =
    dateKey();


  let data =
    getWorkoutData(
      today,
      currentWorkout
    );


  if (!data) {

    data = {

      type:
        currentWorkout,

      date:
        today,

      completed:
        false,

      exercises:
        []

    };

  }


  let exercise =
    data.exercises.find(
      e =>
        e.id ===
        exerciseId
    );


  if (!exercise) {

    exercise = {

      id:
        exerciseId,

      sets:
        "",

      reps:
        "",

      weight:
        "",

      completed:
        false

    };


    data.exercises.push(
      exercise
    );

  }


  exercise[field] =
    value === ""
      ? ""
      : Number(value);


  saveWorkoutData(
    today,
    currentWorkout,
    data
  );

}


/* =========================================================
   TOGGLE EXERCISE
   ========================================================= */

function toggleExerciseComplete(
  exerciseId
) {

  const today =
    dateKey();


  let data =
    getWorkoutData(
      today,
      currentWorkout
    );


  if (!data) {

    data = {

      type:
        currentWorkout,

      date:
        today,

      completed:
        false,

      exercises:
        []

    };

  }


  let exercise =
    data.exercises.find(
      e =>
        e.id ===
        exerciseId
    );


  if (!exercise) {

    exercise = {

      id:
        exerciseId,

      sets:
        "",

      reps:
        "",

      weight:
        "",

      completed:
        false

    };


    data.exercises.push(
      exercise
    );

  }


  exercise.completed =
    !exercise.completed;


  saveWorkoutData(
    today,
    currentWorkout,
    data
  );


  renderExercises();

}


/* =========================================================
   PROGRESS
   ========================================================= */

function updateWorkoutProgress() {

  if (!currentWorkout) {
    return;
  }


  const date =
    viewingHistoricalWorkout
      ? historicalWorkoutDate
      : dateKey();


  const data =
    getWorkoutData(
      date,
      currentWorkout
    );


  const total =
    WORKOUTS[
      currentWorkout
    ].exercises.length;


  const completed =
    data?.exercises?.filter(
      e =>
        e.completed
    ).length || 0;


  const percent =
    total
      ? completed /
        total *
        100
      : 0;


  document.getElementById(
    "workoutProgressText"
  ).textContent =
    `${completed} / ${total}`;


  document.getElementById(
    "workoutProgressBar"
  ).style.width =
    `${percent}%`;

}


/* =========================================================
   COMPLETE WORKOUT
   ========================================================= */

function completeWorkout() {

  if (
    viewingHistoricalWorkout
  ) {
    return;
  }


  const today =
    dateKey();


  let data =
    getWorkoutData(
      today,
      currentWorkout
    );


  if (!data) {

    data = {

      type:
        currentWorkout,

      date:
        today,

      completed:
        false,

      exercises:
        []

    };

  }


  data.completed =
    true;


  data.completedAt =
    new Date()
      .toISOString();


  saveWorkoutData(
    today,
    currentWorkout,
    data
  );


  alert(
    `${WORKOUTS[currentWorkout].title} completed! 💪`
  );


  goHome();

}


/* =========================================================
   PREVIOUS WEIGHT
   ========================================================= */

function getPreviousWeight(
  type,
  exerciseId
) {

  const today =
    dateFromKey(
      dateKey()
    );


  for (
    let i = 1;
    i <= 84;
    i++
  ) {

    const date =
      new Date(today);


    date.setDate(
      today.getDate() - i
    );


    const data =
      getWorkoutData(
        dateKey(date),
        type
      );


    if (!data) {
      continue;
    }


    const exercise =
      data.exercises?.find(
        e =>
          e.id ===
          exerciseId
      );


    if (
      exercise &&
      exercise.weight !== "" &&
      exercise.weight !== undefined
    ) {

      return exercise.weight;

    }

  }


  return "";

}


/* =========================================================
   HISTORY
   ========================================================= */

function getLast12WeeksWorkouts() {

  const result =
    [];


  const today =
    dateFromKey(
      dateKey()
    );


  for (
    let i = 0;
    i < 84;
    i++
  ) {

    const date =
      new Date(today);


    date.setDate(
      today.getDate() - i
    );


    const key =
      dateKey(date);


    for (
      const type of [
        "upper",
        "lower"
      ]
    ) {

      const data =
        getWorkoutData(
          key,
          type
        );


      if (
        data?.completed
      ) {

        result.push({

          date:
            key,

          type,

          data

        });

      }

    }

  }


  return result;

}


function renderHistory() {

  const workouts =
    getLast12WeeksWorkouts();


  document.getElementById(
    "totalWorkouts"
  ).textContent =
    workouts.length;


  renderWeeklyChart();


  renderHistoryList(
    workouts
  );

}


/* =========================================================
   WEEKLY CHART
   ========================================================= */

function renderWeeklyChart() {

  const container =
    document.getElementById(
      "weeklyChart"
    );


  container.innerHTML =
    "";


  const today =
    dateFromKey(
      dateKey()
    );


  for (
    let week = 0;
    week < 12;
    week++
  ) {

    let count = 0;


    for (
      let day = 0;
      day < 7;
      day++
    ) {

      const date =
        new Date(today);


      date.setDate(
        today.getDate()
        -
        week * 7
        -
        day
      );


      const key =
        dateKey(date);


      if (
        getWorkoutData(
          key,
          "upper"
        )?.completed
      ) {

        count++;

      }


      if (
        getWorkoutData(
          key,
          "lower"
        )?.completed
      ) {

        count++;

      }

    }


    const start =
      new Date(today);


    start.setDate(
      today.getDate()
      -
      week * 7
      -
      6
    );


    const end =
      new Date(today);


    end.setDate(
      today.getDate()
      -
      week * 7
    );


    const width =
      Math.min(
        100,
        count / 4 * 100
      );


    const row =
      document.createElement(
        "div"
      );


    row.className =
      "week-row";


    row.innerHTML = `

      <div class="week-label">

        Week ${12 - week}

      </div>


      <div class="week-bar-container">

        ${
          count > 0

          ?

          `

            <div
              class="week-bar"
              style="
                width:${Math.max(
                  width,
                  15
                )}%;
              "
            >

              ${count}

            </div>

          `

          :

          ""

        }

      </div>


      <div class="week-dates">

        ${formatShortDate(
          start
        )}

        –

        ${formatShortDate(
          end
        )}

      </div>

    `;


    container.appendChild(
      row
    );

  }


  document.getElementById(
    "currentStreak"
  ).textContent =
    calculateWeekStreak();

}


/* =========================================================
   WEEK STREAK
   ========================================================= */

function calculateWeekStreak() {

  const today =
    dateFromKey(
      dateKey()
    );


  let streak = 0;


  for (
    let week = 0;
    week < 12;
    week++
  ) {

    let found =
      false;


    for (
      let day = 0;
      day < 7;
      day++
    ) {

      const date =
        new Date(today);


      date.setDate(
        today.getDate()
        -
        week * 7
        -
        day
      );


      const key =
        dateKey(date);


      if (

        getWorkoutData(
          key,
          "upper"
        )?.completed

        ||

        getWorkoutData(
          key,
          "lower"
        )?.completed

      ) {

        found =
          true;

        break;

      }

    }


    if (found) {

      streak++;

    } else {

      break;

    }

  }


  return streak;

}


/* =========================================================
   HISTORY LIST
   ========================================================= */

function renderHistoryList(
  workouts
) {

  const container =
    document.getElementById(
      "historyList"
    );


  container.innerHTML =
    "";


  if (
    workouts.length === 0
  ) {

    container.innerHTML = `

      <div class="last-card">

        <div style="
          text-align:center;
        ">

          <div style="
            font-size:30px;
          ">
            📊
          </div>

          <strong>
            No workout history
          </strong>

          <div style="
            color:var(--muted);
            font-size:12px;
            margin-top:4px;
          ">

            Your completed workouts
            will appear here.

          </div>

        </div>

      </div>

    `;

    return;

  }


  workouts.forEach(
    workout => {

      const date =
        dateFromKey(
          workout.date
        );


      const completedExercises =
        workout.data
          .exercises
          ?.filter(
            e =>
              e.completed
          ).length || 0;


      const totalExercises =
        WORKOUTS[
          workout.type
        ].exercises.length;


      const card =
        document.createElement(
          "button"
        );


      card.className =
        "history-card";


      card.onclick =
        () =>
          openHistoricalWorkout(
            workout
          );


      card.innerHTML = `

        <div class="history-row">

          <div class="history-icon">

            ${
              workout.type ===
              "upper"

                ? "💪"

                : "🦵"

            }

          </div>


          <div class="history-info">

            <strong>

              ${
                WORKOUTS[
                  workout.type
                ].title
              }

            </strong>


            <span>

              ${formatShortDate(
                date
              )}

              ·

              ${completedExercises}
              /
              ${totalExercises}
              exercises

            </span>

          </div>


          <div class="history-arrow">

            ›

          </div>

        </div>

      `;


      container.appendChild(
        card
      );

    }
  );

}


/* =========================================================
   HISTORICAL WORKOUT
   ========================================================= */

function openHistoricalWorkout(
  workout
) {

  currentWorkout =
    workout.type;


  viewingHistoricalWorkout =
    true;


  historicalWorkoutDate =
    workout.date;


  hideScreens();


  document
    .getElementById(
      "workoutScreen"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "workoutTypeLabel"
    ).textContent =
      formatDate(
        dateFromKey(
          workout.date
        )
      );


  document
    .getElementById(
      "workoutTitle"
    ).textContent =
      WORKOUTS[
        workout.type
      ].title;


  document
    .getElementById(
      "completeWorkoutButton"
    )
    .classList.add(
      "hidden"
    );


  renderHistoricalExercises(
    workout
  );


  window.scrollTo(
    0,
    0
  );

}


/* =========================================================
   HISTORICAL EXERCISES
   ========================================================= */

function renderHistoricalExercises(
  workout
) {

  const container =
    document.getElementById(
      "exerciseList"
    );


  container.innerHTML =
    "";


  WORKOUTS[
    workout.type
  ].exercises.forEach(
    (
      exercise,
      index
    ) => {


      const saved =
        workout.data
          .exercises
          ?.find(
            e =>
              e.id ===
              exercise.id
          );


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "exercise-card";


      card.innerHTML = `

        <div class="exercise-title-row">

          <div class="exercise-number">

            ${index + 1}

          </div>


          <div class="exercise-title">

            ${escapeHtml(
              exercise.title
            )}

          </div>

        </div>


        <div
          id="video_${exercise.id}"
          class="video-section">

          <div
            class="video-placeholder"
            onclick="loadYouTube('${exercise.id}')">

            <div class="play">
              ▶
            </div>

            <div class="video-label">
              Tap to watch technique
            </div>

          </div>

        </div>


        <div
          class="input-grid"
          style="margin-top:15px">


          <div class="input-wrapper">

            <div style="
              background:var(--soft);
              border-radius:13px;
              padding:12px;
              font-size:17px;
              font-weight:800;
            ">

              ${
                saved?.sets ??
                exercise.sets
              }

            </div>

            <div class="input-caption">
              SETS
            </div>

          </div>


          <div class="input-wrapper">

            <div style="
              background:var(--soft);
              border-radius:13px;
              padding:12px;
              font-size:17px;
              font-weight:800;
            ">

              ${
                saved?.reps ??
                exercise.reps
              }

            </div>

            <div class="input-caption">
              REPS
            </div>

          </div>


          <div class="input-wrapper">

            <div style="
              background:var(--soft);
              border-radius:13px;
              padding:12px;
              font-size:17px;
              font-weight:800;
            ">

              ${
                saved?.weight !== undefined &&
                saved?.weight !== ""

                  ? saved.weight

                  : "—"

              }

            </div>

            <div class="input-caption">
              KG
            </div>

          </div>


        </div>


        ${
          saved?.completed

          ?

          `

            <div
              class="exercise-complete done"
              style="
                margin-top:13px;
                text-align:center;
              ">

              ✓ Completed

            </div>

          `

          :

          ""

        }

      `;


      container.appendChild(
        card
      );

    }
  );


  updateHistoricalProgress(
    workout
  );

}


/* =========================================================
   HISTORICAL PROGRESS
   ========================================================= */

function updateHistoricalProgress(
  workout
) {

  const completed =
    workout.data
      .exercises
      ?.filter(
        e =>
          e.completed
      ).length || 0;


  const total =
    WORKOUTS[
      workout.type
    ].exercises.length;


  document.getElementById(
    "workoutProgressText"
  ).textContent =
    `${completed} / ${total}`;


  document.getElementById(
    "workoutProgressBar"
  ).style.width =
    `${completed / total * 100}%`;

}


/* =========================================================
   DARK MODE
   ========================================================= */

function toggleTheme() {

  const isDark =
    document.documentElement
      .classList
      .contains(
        "dark"
      );


  if (isDark) {

    document.documentElement
      .classList
      .remove(
        "dark"
      );


    localStorage.setItem(
      "fitness_theme",
      "light"
    );


    document.getElementById(
      "themeBtn"
    ).textContent =
      "☀️";

  } else {

    document.documentElement
      .classList
      .add(
        "dark"
      );


    localStorage.setItem(
      "fitness_theme",
      "dark"
    );


    document.getElementById(
      "themeBtn"
    ).textContent =
      "🌙";

  }

}


function initializeTheme() {

  const saved =
    localStorage.getItem(
      "fitness_theme"
    );


  const dark =
    saved === "dark" ||

    (
      !saved &&

      window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches
    );


  if (dark) {

    document.documentElement
      .classList
      .add(
        "dark"
      );


    document.getElementById(
      "themeBtn"
    ).textContent =
      "🌙";

  }

}


/* =========================================================
   HEADER
   ========================================================= */

function renderHeader() {

  document.getElementById(
    "headerDate"
  ).textContent =
    new Date()
      .toLocaleDateString(
        "en-IN",
        {
          weekday: "long",
          month: "short",
          day: "numeric"
        }
      );

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(
  value
) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================================
   START
   ========================================================= */

initializeTheme();

renderHeader();

goHome();

</script>
